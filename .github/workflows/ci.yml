name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        cache-dependency-path: 'yarn.lock'
        
    - name: Install dependencies
      run: yarn install --immutable
      
    - name: Build TypeScript (Simulation)
      run: yarn workspace simulation tsc --noEmit
      
    - name: Build TypeScript (Processor Lambda)
      run: yarn workspace telemetry-processor tsc --noEmit
      
    - name: Synth CDK Subsystem
      run: yarn workspace infra cdk synth
